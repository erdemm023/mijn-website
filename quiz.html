<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🧠 Quiz</h1>
    <p id="vraag">Wat is 2 + 2?</p>

    <button onclick="check(3)">3</button>
    <button onclick="check(4)">4</button>
    <button onclick="check(5)">5</button>

    <p id="resultaat"></p>
</div>

<script>
function check(antwoord) {
    if (antwoord === 4) {
        document.getElementById("resultaat").innerText = "✅ Goed!";
    } else {
        document.getElementById("resultaat").innerText = "❌ Fout!";
    }
}
</script>

</body>
</html>
