<!DOCTYPE html>
<html>
<head>
    <title>Mijn Website</title>

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #resultaat {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>🔐 Mijn Wachtwoord Generator</h1>

<p>Hoe lang moet het wachtwoord zijn?</p>
<input type="number" id="lengte" value="10">

<br><br>

<button onclick="genereer()">Genereer</button>

<p id="resultaat"></p>

<script>
function genereer() {
    let lengte = document.getElementById("lengte").value;
    let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
    let wachtwoord = "";

    for (let i = 0; i < lengte; i++) {
        wachtwoord += chars[Math.floor(Math.random() * chars.length)];
    }

    document.getElementById("resultaat").innerText = "Wachtwoord: " + wachtwoord;
}
</script>

</body>
</html>
